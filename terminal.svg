<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="title desc">
  <title id="title">Berkan Aliji</title>
  <desc id="desc">Terminal: whoami ergibt Berkan Aliji. Praktikum bei der Automatic-Server AG, Schwerpunkt Linux und Infrastruktur. Werkzeuge: Debian, bash, git, vim, tmux, Kubernetes.</desc>
  <defs>
    <clipPath id="screen">
      <rect x="1" y="1" width="758" height="288" rx="10"/>
    </clipPath>
    <pattern id="scan" width="6" height="3" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" fill="#000000" fill-opacity="0.38"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="glow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .line { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 15px; }
      .prompt { fill: #4cc983; }
      .cmd { fill: #b8ffd4; }
      .out { fill: #7cf5a8; }
      .bar { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #3f7a57; letter-spacing: 0.04em; }
      .cursor { fill: #b8ffd4; animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { fill-opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="289" rx="10" fill="#08110c" stroke="#1d3a29"/>

  <g clip-path="url(#screen)">
    <rect x="0" y="0" width="760" height="34" fill="#0d1a12"/>
    <line x1="0" y1="34" x2="760" y2="34" stroke="#1d3a29"/>
    <circle cx="22" cy="17" r="5.5" fill="#1f4a32"/>
    <circle cx="40" cy="17" r="5.5" fill="#1f4a32"/>
    <circle cx="58" cy="17" r="5.5" fill="#1f4a32"/>
    <text class="bar" x="380" y="21" text-anchor="middle">berknal@werkstatt: ~</text>

    <g filter="url(#glow)">
      <text class="line" x="26" y="70"><tspan class="prompt">berknal@werkstatt:~$ </tspan><tspan class="cmd">whoami</tspan></text>
      <text class="line out" x="26" y="94">berkan aliji</text>

      <text class="line" x="26" y="130"><tspan class="prompt">berknal@werkstatt:~$ </tspan><tspan class="cmd">cat rolle.txt</tspan></text>
      <text class="line out" x="26" y="154">Praktikum bei der Automatic-Server AG</text>
      <text class="line out" x="26" y="178">Schwerpunkt Linux und Infrastruktur</text>

      <text class="line" x="26" y="214"><tspan class="prompt">berknal@werkstatt:~$ </tspan><tspan class="cmd">ls werkzeuge/</tspan></text>
      <text class="line out" x="26" y="238" xml:space="preserve">debian  bash  git  vim  tmux  kubernetes</text>

      <text class="line" x="26" y="274"><tspan class="prompt">berknal@werkstatt:~$ </tspan><tspan class="cursor">█</tspan></text>
    </g>

    <rect x="0" y="35" width="760" height="255" fill="url(#scan)"/>
    <rect x="0" y="0" width="760" height="290" fill="url(#vignette)"/>
  </g>
</svg>
